# Образец шаблона проекта сборщика для панели governetics. Свой шаблон держите у себя (в репозитории
# проекта, который собираете): туда идут ключи рецептов и всё, что знает о проекте.
#
# vpn    — клиент OpenVPN к закрытой сети, если она нужна сборке. Раннер делит с ним сетевое
#          пространство, поэтому порт раннера объявлен здесь. Профиль и логин приходят скрытыми
#          файлами проекта; в образе их нет. Если закрытая сеть не нужна — уберите сервис, а порт
#          и `network_mode` раннера верните ему.
# dind   — отдельный демон Docker для сборок (привилегированный контейнер, свой том образов);
#          сокет хоста не используется, уборка образов на узле сборки не задевает.
# runner — раннер g9s-builders: принимает bundle, собирает по рецепту, отдаёт артефакты.
#          Порт 9191 (→ 8181 раннера) слушает на всех адресах узла — закрывайте его экраном узла или
#          публикуйте только через edge с TLS.
#
# tokens      — строки «имя=токен», один на человека. Токен = право исполнять код в сборщике.
# recipe.<имя> — скрипт рецепта (раннер находит его как рецепт «<имя>»); ключей может быть несколько.
x-g9s-config:
  envs:
    REGISTRY_READER_USER: {consumers: [registry-gate]}
    REGISTRY_READER_HASH: {consumers: [registry-gate], visibility: invisible}
  files:
    tokens: {consumers: [runner], visibility: invisible, mode: "0400"}
    registry.Caddyfile: {consumers: [registry-gate], mode: "0444"}
    npmrc: {consumers: [runner], visibility: invisible, mode: "0400", presence: optional}
    recipe.example: {consumers: [runner], mode: "0444"}
    repo.example: {consumers: [runner], mode: "0444", presence: optional}
    git_credentials.example: {consumers: [runner], visibility: invisible, mode: "0400", presence: optional}
    vpn.ovpn: {consumers: [vpn], visibility: invisible, mode: "0400"}
    vpn_auth: {consumers: [vpn], visibility: invisible, mode: "0400"}
services:
  vpn:
    image: ghcr.io/ancientglider/g9s-builders/openvpn:v0.1.1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9191:8181"
    restart: unless-stopped
  dind:
    # docker:28-dind, отпечаток снят 2026-10-21
    image: docker:28-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--insecure-registry=registry:5000"]
    volumes:
      - dind-data:/var/lib/docker
    restart: unless-stopped
  registry:
    # CNCF Distribution 3.1.2, digest taken 2026-10-22. Not published: the builder pushes from inside the
    # project, the outside reads through registry-gate.
    image: registry:3@sha256:be9a7062dd7e3316e5c0368e42740dc991a9ceb5d382317675a8738db0112af0
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      OTEL_TRACES_EXPORTER: none
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped
  registry-gate:
    # caddy:2-alpine, digest taken 2026-10-22: read-only, authenticated door to the registry on 9192.
    image: caddy:2-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    command: ["caddy", "run", "--config", "/etc/g9s/files/registry.Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "9192:9192"
    depends_on:
      - registry
    restart: unless-stopped
  runner:
    image: ghcr.io/ancientglider/g9s-builders/java:v0.4.0
    network_mode: "service:vpn"
    environment:
      DOCKER_HOST: tcp://dind:2375
      G9S_RUNNER_TOKENS: /etc/g9s/files/tokens
      G9S_REGISTRY: registry:5000
      G9S_REGISTRY_NAMESPACE: builds
      G9S_REGISTRY_KEEP: "10"
      G9S_ADMINS: ""            # names from the tokens file allowed to clean the registry
      G9S_RECIPE_FILES: /etc/g9s/files
      NPM_CONFIG_USERCONFIG: /etc/g9s/files/npmrc
      G9S_KEEP_BUILDS: "5"
      G9S_BUILD_TIMEOUT: "7200"
    volumes:
      - builds:/data
      - registry-data:/var/lib/registry   # same storage as the registry: retention runs garbage-collect
      - m2:/root/.m2
      - npm-cache:/root/.npm
    depends_on:
      - vpn
      - dind
    restart: unless-stopped
volumes:
  dind-data: {}
  registry-data: {}
  builds: {}
  m2: {}
  npm-cache: {}
