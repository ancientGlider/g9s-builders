# Publishes a stack image to ghcr.io on a tag «<stack>/vX.Y.Z» (e.g. java/v0.1.0 →
# ghcr.io/ancientglider/g9s-builders/java:v0.1.0), linux/amd64 only.
name: publish

on:
  push:
    tags: ["*/v*"]
  workflow_dispatch:
    inputs:
      stack:
        description: "stack directory under stacks/"
        required: true
        default: java
      version:
        description: "image tag, e.g. v0.1.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            stack="${{ inputs.stack }}"; version="${{ inputs.version }}"
          else
            stack="${GITHUB_REF_NAME%%/*}"; version="${GITHUB_REF_NAME#*/}"
          fi
          # a stack (toolchain + runner) or a sidecar (helper container) — same naming, same registry path
          if [ -f "stacks/$stack/Dockerfile" ]; then dir="stacks/$stack"; else dir="sidecars/$stack"; fi
          test -f "$dir/Dockerfile"
          echo "stack=$stack" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/g9s-builders/$stack" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.ref.outputs.dir }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
